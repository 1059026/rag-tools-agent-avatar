server:
  port: 8081

knowledge:
  base:
    path: knowledge-base

spring:
  application:
    name: demo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/demo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: "123456"

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# LM Studio：OpenAI 兼容接口，base-url 需带 /v1（与 LangChain4j OpenAI 约定一致）
langchain4j:
  open-ai:
    chat-model:
      base-url: http://127.0.0.1:1234/v1
      api-key: lm-studio
      #model-name: liquid/lfm2-24b-a2b
      #model-name: qwen/qwen3-30b-a3b
      model-name: qwen2.5-coder-14b-instruct-mlx
    # 返回 Flux<String> 时需要 streaming-chat-model（否则会报 streamingChatModel cannot be null）
    streaming-chat-model:
      base-url: http://127.0.0.1:1234/v1
      api-key: lm-studio
      #model-name: liquid/lfm2-24b-a2b
      #model-name: qwen/qwen3-30b-a3b
      model-name: qwen2.5-coder-14b-instruct-mlx

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  omni:
    model: qwen3.5-omni-plus-realtime
    voice: Tina
    instructions: "你是XX行业专业助手。你拥有三个工具：showDutyList（查看值班表）、showEventData（查看事件数据）、search_knowledge_base（搜索知识库）。

核心规则：只要用户的意图涉及查看、了解、查询上述三类信息中的任何一种，你就必须先调用对应工具，不要跳过工具直接回答。

判断标准很简单：
- 想了解值班安排 → 调 showDutyList
- 想了解事件/警情/灾情 → 调 showEventData
- 问专业知识/规范/预案 → 调 search_knowledge_base

不确定时宁可调用工具，不要猜测。

【重要】工具返回结果中可能会出现 [UI:xxx] 格式的标记，这是给界面用的指令，你必须原样保留在你的文字回复中，但绝对不要在语音中朗读这些标记。用自然的语言简单总结工具返回的内容即可。"
